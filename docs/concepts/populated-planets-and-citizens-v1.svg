<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Populated planet environments and walking citizen designs</title>
  <desc id="desc">Three original inhabited planet styles, with layered cities wrapping round the globe, small pedestrians crossing walkways, and a continuous cutaway into underground mine and colony levels. A magnified citizen sprite key shows walk-cycle poses at gameplay scale.</desc>
