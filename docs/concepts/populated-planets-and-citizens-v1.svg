    <text x="1218" y="874">Gameplay scale: 6–9 px tall, 2–3 px wide.</text>
    <text x="1218" y="897">Two-pose walk loop; 6–8 frames/sec, offset</text><text x="1218" y="917">each person so crowds don't march in sync.</text>
    <text x="1218" y="951">Use 3 readable silhouettes: worker, resident,</text><text x="1218" y="971">service crew. Color blocks identify role; tiny</text><text x="1218" y="991">face detail is unnecessary at normal zoom.</text>
    <text x="1218" y="1025">Walk on the upper promenade and transit decks.</text><text x="1218" y="1045">Keep the miner path and landing site unobstructed.</text>
    <text x="1218" y="1079">At orbital zoom: reduce to sparse moving dots.</text>
  </g>
  <path d="M1180 570v535" stroke="#425650"/>
  <text x="70" y="1158" fill="#e8c68b" font-family="monospace" font-size="12" letter-spacing="1.5">WORLD RULE</text>
  <text x="70" y="1191" fill="#dce5dc" font-family="Arial,sans-serif" font-size="15">Follow the same city layers around the curved planet; pedestrians move on world-anchored walkways. Mining tunnels, colony rooms, and ore veins continue beneath that city.</text>
