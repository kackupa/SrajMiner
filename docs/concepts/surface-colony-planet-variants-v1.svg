<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Planet-specific surface building art variants</title>
  <desc id="desc">Five colony art kits adapt the same repair bay, habitat, charge depot, and turret silhouettes to Mars Frontier, Cryo Shelf, Hull Graveyard, Prism Fault, and Cinder Vale.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172326"/><stop offset="1" stop-color="#10191c"/></linearGradient>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#80614f"/><stop offset="1" stop-color="#453b37"/></linearGradient>
    <g id="bay">
      <path d="M-45 0v-39l13-16h64l13 16V0z" fill="var(--shell)" stroke="var(--edge)" stroke-width="3"/>
      <path d="M-36-47h72v8h-72z" fill="var(--frame)"/><path d="M-24 0v-31h48V0z" fill="#172326" stroke="var(--frame)" stroke-width="3"/>
      <path d="M-17-24h34v18h-34z" fill="var(--window)"/><path d="M-54 3h108" stroke="var(--frame)" stroke-width="6"/>
      <path d="M-38-53v-8m76 8v-8m-76 0h76" stroke="var(--frame)" stroke-width="4"/>
      <circle cx="-31" cy="-21" r="4" fill="var(--light)"/><circle cx="31" cy="-21" r="4" fill="var(--light)"/>
    </g>
    <g id="hab">
      <path d="M-36 0v-38l12-14h48l12 14V0z" fill="var(--shell)" stroke="var(--edge)" stroke-width="3"/>
      <path d="M-27-45h54v7h-54z" fill="var(--frame)"/><path d="M-15-30h13v12h-13zm20 0h13v12H5z" fill="var(--window)"/>
      <path d="M-7 0v-17h14V0" fill="#253235" stroke="var(--frame)" stroke-width="2"/>
      <path d="M-42 4h84m-28 0-7 10m21-10 7 10" stroke="var(--frame)" stroke-width="4"/>
      <circle cx="-28" cy="-15" r="3.5" fill="var(--light)"/>
    </g>
    <g id="charge">
      <path d="M-29 5h58v9h-58z" fill="var(--frame)" stroke="var(--edge)" stroke-width="2"/>
      <rect x="-25" y="-38" width="22" height="42" rx="7" fill="var(--shell)" stroke="var(--edge)" stroke-width="3"/>
      <rect x="4" y="-38" width="22" height="42" rx="7" fill="var(--shell)" stroke="var(--edge)" stroke-width="3"/>
      <path d="M-20-40v-7h12v7m20 0v-7h12v7" fill="var(--frame)"/>
      <path d="M-20-22h12m17 0h12" stroke="var(--light)" stroke-width="4"/>
      <path d="M-4-12h8v16h-8z" fill="var(--frame)"/>
    </g>
    <g id="turret">
      <path d="M-29 4h58v10h-58z" fill="var(--frame)" stroke="var(--edge)" stroke-width="2"/>
      <path d="M-18 3v-26l8-10h20l8 10V3z" fill="var(--shell)" stroke="var(--edge)" stroke-width="3"/>
      <path d="M-10-29h20v-9h-20z" fill="var(--frame)" stroke="var(--edge)" stroke-width="2"/>
      <path d="M0-38v-24m0 10 20-8" stroke="var(--frame)" stroke-width="6"/>
      <circle cx="20" cy="-60" r="4" fill="var(--light)"/>
      <path d="M-8-15h16" stroke="var(--window)" stroke-width="4"/>
    </g>
    <g id="world">
      <path d="M0 0q20-18 40 0t40 0t40 0t40 0t40 0" fill="none" stroke="url(#ground)" stroke-width="55"/>
      <path d="M0-28q20-8 40 0t40 0t40 0t40 0t40 0" fill="none" stroke="var(--accent)" stroke-width="4" opacity=".8"/>
    </g>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="46" y="49" fill="#e8ddc3" font-family="monospace" font-size="25" font-weight="bold" letter-spacing="3">ONE COLONY KIT · FIVE PLANET IDENTITIES</text>
  <text x="47" y="78" fill="#92a69b" font-family="monospace" font-size="11" letter-spacing="2">SAME SERVICE · SAME FOOTPRINT · DIFFERENT SHELL, WEATHERPROOFING, FOUNDATIONS &amp; LIGHT</text>
  <path d="M46 99H1554" stroke="#465751"/>
  <text x="70" y="132" fill="#d7caa9" font-family="monospace" font-size="10" letter-spacing="1">SHARED SILHOUETTES: REPAIR BAY · HABITAT · CHARGE DEPOT · STARTER TURRET</text>
  <text x="1232" y="132" fill="#879a8e" font-family="monospace" font-size="9">ART / PALETTE PROPOSAL</text>
  <!-- Column headers -->
  <g font-family="monospace" font-weight="bold" font-size="12">
    <text x="84" y="171" fill="#d5a16f">MARS FRONTIER</text><text x="390" y="171" fill="#a8e1eb">CRYO SHELF</text><text x="694" y="171" fill="#bdc5b9">HULL GRAVEYARD</text><text x="1000" y="171" fill="#c5b8d5">PRISM FAULT</text><text x="1304" y="171" fill="#f29a67">CINDER VALE</text>
  </g>
  <!-- palette swatches -->
  <g stroke="#83958a" stroke-width="1">
    <g transform="translate(85 185)"><rect width="36" height="12" fill="#80503a"/><rect x="40" width="36" height="12" fill="#b5774d"/><rect x="80" width="36" height="12" fill="#d0b58c"/><rect x="120" width="36" height="12" fill="#e8ba79"/><rect x="160" width="36" height="12" fill="#8be1cf"/></g>
    <g transform="translate(390 185)"><rect width="36" height="12" fill="#344b57"/><rect x="40" width="36" height="12" fill="#638a9b"/><rect x="80" width="36" height="12" fill="#c2e1e5"/><rect x="120" width="36" height="12" fill="#e8ba79"/><rect x="160" width="36" height="12" fill="#8be1cf"/></g>
    <g transform="translate(695 185)"><rect width="36" height="12" fill="#38403d"/><rect x="40" width="36" height="12" fill="#68716a"/><rect x="80" width="36" height="12" fill="#a4a590"/><rect x="120" width="36" height="12" fill="#dfb774"/><rect x="160" width="36" height="12" fill="#8be1cf"/></g>
    <g transform="translate(1000 185)"><rect width="36" height="12" fill="#34373c"/><rect x="40" width="36" height="12" fill="#565467"/><rect x="80" width="36" height="12" fill="#9990b4"/><rect x="120" width="36" height="12" fill="#d5b2e8"/><rect x="160" width="36" height="12" fill="#8be1cf"/></g>
    <g transform="translate(1305 185)"><rect width="36" height="12" fill="#302c2b"/><rect x="40" width="36" height="12" fill="#4b4642"/><rect x="80" width="36" height="12" fill="#888077"/><rect x="120" width="36" height="12" fill="#ee8955"/><rect x="160" width="36" height="12" fill="#8be1cf"/></g>
  </g>
  <!-- columns backgrounds -->
  <g fill="#202d2e" stroke="#465751"><rect x="58" y="217" width="286" height="584" rx="4"/><rect x="362" y="217" width="286" height="584" rx="4"/><rect x="666" y="217" width="286" height="584" rx="4"/><rect x="970" y="217" width="286" height="584" rx="4"/><rect x="1274" y="217" width="268" height="584" rx="4"/></g>
  <!-- planet variables through scoped inline styles -->
  <g style="--shell:#80503a;--frame:#49372f;--edge:#d0b58c;--window:#e8ba79;--light:#8be1cf;--accent:#be8057">
    <g transform="translate(79 256)"><use href="#world"/><path d="M34-22q10-28 20-6m26-2q10-25 18-4m24-1q11-25 19-5" fill="none" stroke="#b5774d" stroke-width="5"/></g>
    <g transform="translate(200 337) scale(.9)"><use href="#bay"/></g><g transform="translate(200 464) scale(.8)"><use href="#hab"/></g><g transform="translate(200 586) scale(.85)"><use href="#charge"/></g><g transform="translate(200 704) scale(.82)"><use href="#turret"/></g>
    <path d="M129 370q10 10 22 0m-25 8q13 10 26 0" fill="none" stroke="#b5774d" stroke-width="3"/><path d="M172 624h56" stroke="#b5774d" stroke-width="6"/>
  </g>
  <g style="--shell:#344b57;--frame:#273840;--edge:#c2e1e5;--window:#e8ba79;--light:#8be1cf;--accent:#9bcbd8">
    <g transform="translate(383 256)"><use href="#world"/><path d="M45-26l15-22 13 22m26-1 14-25 15 25m25 0 13-20 13 20" fill="none" stroke="#c2e1e5" stroke-width="4"/></g>
    <g transform="translate(504 337) scale(.9)"><use href="#bay"/></g><g transform="translate(504 464) scale(.8)"><use href="#hab"/></g><g transform="translate(504 586) scale(.85)"><use href="#charge"/></g><g transform="translate(504 704) scale(.82)"><use href="#turret"/></g>
    <path d="M471 367v10m66-10v10m-66 0h66" stroke="#9bcbd8" stroke-width="5"/><path d="M469 614h20m28 0h20" stroke="#9bcbd8" stroke-width="5"/><path d="M470 622h70" stroke="#c2e1e5" stroke-width="3"/>
  </g>
  <g style="--shell:#505953;--frame:#303936;--edge:#adb6a9;--window:#dfb774;--light:#8be1cf;--accent:#a4a590">
    <g transform="translate(687 256)"><use href="#world"/><path d="M31-26l12-20 6 22m32 1 18-29 2 30m31-1 14-22 5 24" fill="none" stroke="#a4a590" stroke-width="5"/></g>
    <g transform="translate(808 337) scale(.9)"><use href="#bay"/></g><g transform="translate(808 464) scale(.8)"><use href="#hab"/></g><g transform="translate(808 586) scale(.85)"><use href="#charge"/></g><g transform="translate(808 704) scale(.82)"><use href="#turret"/></g>
    <path d="M761 306l17-8 11 7 16-10m-40 60 18-7 10 5m-12 225 22-12 16 7" fill="none" stroke="#c0b694" stroke-width="4"/><path d="M769 329v-16l10-8 8 8v16m30 0v-22l12-9 10 9v22" fill="#73796d" stroke="#c0b694" stroke-width="2"/>
  </g>
  <g style="--shell:#474650;--frame:#292b34;--edge:#aaa0c1;--window:#d5b2e8;--light:#8be1cf;--accent:#9083aa">
    <g transform="translate(991 256)"><use href="#world"/><path d="M39-24l17-28 14 28m27 0 17-35 18 35m20 0 12-24 17 24" fill="none" stroke="#9083aa" stroke-width="5"/></g>
    <g transform="translate(1112 337) scale(.9)"><use href="#bay"/></g><g transform="translate(1112 464) scale(.8)"><use href="#hab"/></g><g transform="translate(1112 586) scale(.85)"><use href="#charge"/></g><g transform="translate(1112 704) scale(.82)"><use href="#turret"/></g>
    <path d="M1082 308l12-18 12 18-12 18zm39 2 10-16 11 16-11 15z" fill="#696579" stroke="#c5b8d5" stroke-width="2"/><path d="M1098 427h28" stroke="#c5b8d5" stroke-width="5"/><path d="M1088 616l8-12 9 12 8-12 9 12" fill="none" stroke="#c5b8d5" stroke-width="3"/>
  </g>
  <g style="--shell:#45413e;--frame:#282727;--edge:#91867d;--window:#df9862;--light:#8be1cf;--accent:#d6754d">
    <g transform="translate(1294 256)"><use href="#world"/><path d="M36-22l16-8 18 9m31-1 18-9 19 11m17-1 17-7 16 8" fill="none" stroke="#d6754d" stroke-width="5"/></g>
    <g transform="translate(1408 337) scale(.9)"><use href="#bay"/></g><g transform="translate(1408 464) scale(.8)"><use href="#hab"/></g><g transform="translate(1408 586) scale(.85)"><use href="#charge"/></g><g transform="translate(1408 704) scale(.82)"><use href="#turret"/></g>
    <path d="M1376 326h64m-58-6v-8m52 8v-8m-59 13h70" stroke="#d6754d" stroke-width="4"/><path d="M1391 614h33" stroke="#d6754d" stroke-width="6"/><path d="M1386 622h43" stroke="#91867d" stroke-width="3"/>
  </g>
  <!-- row labels and adaptation notes -->
  <g fill="#d7caa9" font-family="monospace" font-size="9" font-weight="bold"><text x="70" y="287">REPAIR BAY</text><text x="70" y="414">HABITAT</text><text x="70" y="536">CHARGE DEPOT</text><text x="70" y="654">STARTER TURRET</text></g>
  <g fill="#92a69b" font-family="monospace" font-size="8"><text x="70" y="774">Dust skirts · grit baffles · buried feet</text><text x="374" y="774">Insulated shell · raised feet · ice anchors</text><text x="678" y="774">Reused ribs · patch plates · cable splices</text><text x="982" y="774">Faceted shields · crack anchors · matte shell</text><text x="1286" y="774">Ash screens · heat baffles · standoff feet</text></g>
  <!-- shared rules -->
  <rect x="58" y="824" width="1484" height="224" rx="4" fill="#202d2e" stroke="#465751"/>
  <text x="82" y="859" fill="#e8ddc3" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">SHARED GAMEPLAY CONTRACT</text>
  <path d="M82 875H1518" stroke="#465751"/>
  <text x="83" y="906" fill="#8be1cf" font-family="monospace" font-size="10" font-weight="bold">UNCHANGED ACROSS PLANETS</text>
  <text x="83" y="929" fill="#b9c3b4" font-family="monospace" font-size="10">Footprint masks · collision · service function · interaction point · price · upgrade tier · save identity · damage states</text>
  <text x="83" y="970" fill="#e8ba79" font-family="monospace" font-size="10" font-weight="bold">ADAPT PER PLANET</text>
  <text x="83" y="993" fill="#b9c3b4" font-family="monospace" font-size="10">Shell palette · weather sealing · foundation/contact · panel shapes · window framing · nonfunctional local props · subtle light accent</text>
  <text x="83" y="1025" fill="#879a8e" font-family="monospace" font-size="9">Keep silhouettes crisp and readable at gameplay scale. Use 2–4 flat tones per material; no texture noise or ore-like signals. The service identity must read first.</text>
  <text x="48" y="1080" fill="#879a8e" font-family="monospace" font-size="9">ORIGINAL VECTOR ART DIRECTION · DARK INDUSTRIAL FRAME / WEATHERED EDGES / WARM WINDOWS / MINT CONTROLS CONTINUE ACROSS THE CAMPAIGN</text>
</svg>
