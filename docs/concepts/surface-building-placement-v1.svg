<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Surface building placement interaction</title>
  <desc id="desc">Build mode shows a selected building ghost anchored to the curved planet surface, footprint and collision feedback, local turret coverage, and a clear purchase confirmation.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172326"/><stop offset="1" stop-color="#10191c"/></linearGradient>
    <linearGradient id="space" x2="0" y2="1"><stop stop-color="#182629"/><stop offset="1" stop-color="#253235"/></linearGradient>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#82614d"/><stop offset="1" stop-color="#453a36"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="hut"><path d="M-33 0v-31l12-13h42l12 13V0z" fill="#344443" stroke="#c1c6ae" stroke-width="3"/><path d="M-26-36h52v7h-52z" fill="#758178"/><path d="M-23-23h46v17h-46z" fill="#202e30"/><path d="M-16-21h12v12h-12zm20 0h12v12H4z" fill="#e8ba79"/><path d="M-39 3h78" stroke="#273631" stroke-width="5"/></g>
    <g id="turret"><path d="M-18 0v-22l10-12h16l10 12V0z" fill="#344443" stroke="#e8ba79" stroke-width="3"/><path d="M-9-27h18v-9H-9z" fill="#758178" stroke="#c1c6ae" stroke-width="2"/><path d="M0-34v-23m0 8 19-8" stroke="#e8ba79" stroke-width="5"/><circle cx="20" cy="-57" r="4" fill="#f0b866"/></g>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <text x="46" y="48" fill="#e8ddc3" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="3">BUILD MODE · SHOW THE EXACT SURFACE ANCHOR</text>
  <text x="47" y="77" fill="#92a69b" font-family="monospace" font-size="11" letter-spacing="2">SELECT → POSITION → CHECK FOOTPRINT &amp; COVERAGE → CONFIRM</text>
  <path d="M46 98H1554" stroke="#465751"/>
  <!-- Main gameplay composition -->
  <rect x="46" y="120" width="1065" height="680" rx="5" fill="url(#space)" stroke="#435551"/>
  <text x="72" y="154" fill="#d7caa9" font-family="monospace" font-size="11" letter-spacing="2">NORMAL GAMEPLAY VIEW · PLAYER CAMERA STAYS PUT</text>
  <circle cx="585" cy="1030" r="682" fill="url(#ground)" stroke="#d19b6b" stroke-width="8"/>
  <path d="M69 509q86-82 176-33t174-21q97-82 190-29t194-9q98-65 194-10t114-31" fill="none" stroke="#a47a5c" stroke-width="11"/>
  <path d="M80 532q74-22 144 12t139 4q88-20 148 18t140 8q93-34 178-6t116 2" fill="none" stroke="#654e42" stroke-width="14"/>
  <!-- Existing compact colony -->
  <g transform="translate(271 497) scale(.78)"><use href="#hut"/></g>
  <g transform="translate(345 478) scale(.68)"><use href="#hut"/></g>
  <g transform="translate(422 500) scale(.78)"><use href="#turret"/></g>
  <path d="M404 433Q474 399 520 449Q548 493 518 532Q474 561 425 540Q392 512 404 470Z" fill="none" stroke="#e8ba79" stroke-width="3" stroke-dasharray="8 7" opacity=".85"/>
  <text x="438" y="411" fill="#f0c78a" font-family="monospace" font-size="11" font-weight="bold">TURRET COVERAGE · 5 TILES</text>
  <!-- Selected ghost and anchor -->
  <g transform="translate(597 460)" opacity=".72"><use href="#hut"/></g>
  <path d="M546 465h103v20H546z" fill="none" stroke="#8be1cf" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M598 481v57" stroke="#8be1cf" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="598" cy="540" r="10" fill="#172326" stroke="#8be1cf" stroke-width="3"/><circle cx="598" cy="540" r="3" fill="#8be1cf"/>
  <path d="M583 540h30m-15-15v30" stroke="#8be1cf" stroke-width="1.5"/>
  <rect x="618" y="522" width="162" height="24" rx="3" fill="#182627" stroke="#8be1cf"/>
  <text x="628" y="538" fill="#a4eadb" font-family="monospace" font-size="10" font-weight="bold">ANCHOR · 7 TILES EAST</text>
  <text x="613" y="437" fill="#8be1cf" font-family="monospace" font-size="11" font-weight="bold">GHOST · REPAIR BAY</text>
  <text x="615" y="454" fill="#b4c2b7" font-family="monospace" font-size="9">TANGENT-ALIGNED ON CRUST</text>
  <!-- Invalid overlapping candidate shown as secondary feedback -->
  <g transform="translate(352 459) scale(.58)" opacity=".3"><use href="#hut"/></g>
  <rect x="291" y="452" width="119" height="33" rx="3" fill="#3b2929" stroke="#d87b68" stroke-width="2"/>
  <text x="303" y="473" fill="#f0a18d" font-family="monospace" font-size="10" font-weight="bold">OCCUPIED</text>
  <!-- Player pod -->
  <path d="M800 525 809 493q18-22 36 0l10 32z" fill="#d6c896" stroke="#263330" stroke-width="3"/><path d="M811 497q16-16 31 0l-4 12h-23z" fill="#8be1cf"/><path d="M800 527h59" stroke="#263330" stroke-width="4"/>
  <text x="785" y="479" fill="#d7caa9" font-family="monospace" font-size="10">YOUR POD</text>
  <!-- Build selection strip -->
  <rect x="68" y="700" width="1020" height="78" rx="4" fill="#10191c" stroke="#52645b"/>
  <text x="88" y="727" fill="#8be1cf" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1">PLACE STRUCTURE</text>
  <text x="88" y="754" fill="#e8ddc3" font-family="monospace" font-size="14" font-weight="bold">REPAIR BAY</text>
  <text x="270" y="727" fill="#92a69b" font-family="monospace" font-size="9">FOOTPRINT</text><text x="270" y="752" fill="#d7caa9" font-family="monospace" font-size="12">3 × 2 TILES</text>
  <text x="435" y="727" fill="#92a69b" font-family="monospace" font-size="9">COST</text><text x="435" y="752" fill="#e8ba79" font-family="monospace" font-size="14" font-weight="bold">$240 + 2 IRON</text>
  <rect x="651" y="715" width="151" height="46" rx="3" fill="#d9b67f"/><text x="678" y="744" fill="#182326" font-family="monospace" font-size="12" font-weight="bold">CONFIRM</text><text x="660" y="773" fill="#92a69b" font-family="monospace" font-size="8">ENTER / CLICK</text>
  <rect x="823" y="715" width="113" height="46" rx="3" fill="#202d2e" stroke="#52645b"/><text x="853" y="744" fill="#d7caa9" font-family="monospace" font-size="12" font-weight="bold">CANCEL</text><text x="839" y="773" fill="#92a69b" font-family="monospace" font-size="8">ESC / RIGHT CLICK</text>
  <text x="954" y="730" fill="#92a69b" font-family="monospace" font-size="9">NO COST UNTIL</text><text x="954" y="746" fill="#92a69b" font-family="monospace" font-size="9">CONFIRMED</text>
  <!-- Explanatory right rail -->
  <rect x="1132" y="120" width="422" height="680" rx="5" fill="#202d2e" stroke="#435551"/>
  <text x="1160" y="159" fill="#e8ddc3" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">WHAT THE PLAYER READS</text>
  <path d="M1160 176H1526" stroke="#465751"/>
  <circle cx="1177" cy="218" r="14" fill="#8be1cf"/><text x="1172" y="223" fill="#172326" font-family="monospace" font-size="12" font-weight="bold">1</text>
  <text x="1205" y="214" fill="#d7caa9" font-family="monospace" font-size="11" font-weight="bold">THE BUILDING GHOST</text><text x="1205" y="234" fill="#92a69b" font-family="monospace" font-size="10">Shows exact size and tangent orientation.</text>
  <circle cx="1177" cy="282" r="14" fill="#8be1cf"/><text x="1172" y="287" fill="#172326" font-family="monospace" font-size="12" font-weight="bold">2</text>
  <text x="1205" y="278" fill="#d7caa9" font-family="monospace" font-size="11" font-weight="bold">THE ANCHOR CROSSHAIR</text><text x="1205" y="298" fill="#92a69b" font-family="monospace" font-size="10">Pins the footprint to one visible crust tile.</text>
  <circle cx="1177" cy="346" r="14" fill="#8be1cf"/><text x="1172" y="351" fill="#172326" font-family="monospace" font-size="12" font-weight="bold">3</text>
  <text x="1205" y="342" fill="#d7caa9" font-family="monospace" font-size="11" font-weight="bold">VALIDITY + REASON</text><text x="1205" y="362" fill="#92a69b" font-family="monospace" font-size="10">Shape, outline and label reinforce status.</text>
  <circle cx="1177" cy="410" r="14" fill="#8be1cf"/><text x="1172" y="415" fill="#172326" font-family="monospace" font-size="12" font-weight="bold">4</text>
  <text x="1205" y="406" fill="#d7caa9" font-family="monospace" font-size="11" font-weight="bold">RANGE / FOOTPRINT</text><text x="1205" y="426" fill="#92a69b" font-family="monospace" font-size="10">Turret arc and building fit are previewed.</text>
  <circle cx="1177" cy="474" r="14" fill="#8be1cf"/><text x="1172" y="479" fill="#172326" font-family="monospace" font-size="12" font-weight="bold">5</text>
  <text x="1205" y="470" fill="#d7caa9" font-family="monospace" font-size="11" font-weight="bold">PRICE + CONFIRM</text><text x="1205" y="490" fill="#92a69b" font-family="monospace" font-size="10">No payment occurs while choosing a site.</text>
  <path d="M1160 526H1526" stroke="#465751"/>
  <text x="1160" y="557" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">DISTANT SITE? USE GLOBE MAP</text>
  <text x="1160" y="580" fill="#92a69b" font-family="monospace" font-size="10">Choose a longitude on the preview map, then</text><text x="1160" y="597" fill="#92a69b" font-family="monospace" font-size="10">return here to inspect the exact crust anchor.</text>
  <!-- Small globe selector inset -->
  <circle cx="1328" cy="685" r="59" fill="#564a44" stroke="#dfbd89" stroke-width="4"/><path d="M1272 670q28-17 50 2t57-4M1271 697q30-12 54 2t56-4" fill="none" stroke="#9a755b" stroke-width="5"/>
  <path d="M1328 626A59 59 0 0 1 1387 685" fill="none" stroke="#8be1cf" stroke-width="7" stroke-linecap="round"/>
  <circle cx="1350" cy="630" r="6" fill="#e8ba79" stroke="#172326" stroke-width="2"/><path d="M1350 612v11" stroke="#e8ba79" stroke-width="2"/>
  <text x="1401" y="674" fill="#8be1cf" font-family="monospace" font-size="9" font-weight="bold">SELECTED</text><text x="1401" y="691" fill="#92a69b" font-family="monospace" font-size="9">LOCAL PREVIEW</text><text x="1401" y="708" fill="#92a69b" font-family="monospace" font-size="9">THEN CONFIRM</text>
  <path d="M46 830H1554" stroke="#465751"/>
  <text x="48" y="864" fill="#d7caa9" font-family="monospace" font-size="11" letter-spacing="1">CONTROLS: POINTER MOVES THE GHOST · WHEEL / ARROWS NUDGE BY ONE SURFACE TILE · ENTER BUILDS · ESC CANCELS</text>
  <text x="48" y="890" fill="#879a8e" font-family="monospace" font-size="10">Build mode suppresses drilling and driving. Candidate is globe-anchored; no cost is spent until explicit confirmation.</text>
</svg>
