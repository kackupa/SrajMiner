<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Interplanetary trade network gameplay concept</title>
  <desc id="desc">Player-built trading posts link planets. A cargo crate is lifted from a surface colony, sent along a visible route, and paid with an itemized sale premium.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172326"/><stop offset="1" stop-color="#10191c"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#202d2e"/><stop offset="1" stop-color="#182426"/></linearGradient>
    <radialGradient id="planet"><stop stop-color="#ba8060"/><stop offset=".72" stop-color="#795647"/><stop offset=".76" stop-color="#d1a77b"/><stop offset=".79" stop-color="#3e4140"/><stop offset="1" stop-color="#282f31"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="post"><path d="M-18 5v-21l7-8h22l7 8V5z" fill="#344443" stroke="#c1c6ae" stroke-width="2"/><path d="M-13-26h26v5h-26z" fill="#9a7558"/><path d="M-8-13h16v12H-8z" fill="#e8ba79"/><path d="M-24 7h48" stroke="#273631" stroke-width="4"/><path d="M0-30v-13m-8 0h16" stroke="#e8ba79" stroke-width="2"/></g>
    <g id="crate"><path d="M-13-8 0-15 13-8V8L0 15-13 8z" fill="#b17d4d" stroke="#f0c78a" stroke-width="2"/><path d="M0-15V1m-13-9L0 0l13-9M0 1v14" fill="none" stroke="#704c37" stroke-width="2"/></g>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <text x="46" y="49" fill="#e8ddc3" font-family="monospace" font-size="25" font-weight="bold" letter-spacing="3">VESPER EXCHANGE · INTERPLANETARY TRADE</text>
  <text x="47" y="78" fill="#92a69b" font-family="monospace" font-size="11" letter-spacing="2">PLAYER-BUILT POSTS · VISIBLE CARGO ROUTES · ONE OFFLINE, PERSISTENT SALE</text>
  <path d="M46 99H1554" stroke="#465751"/>
  <!-- surface pickup -->
  <g transform="translate(46 122)">
    <rect width="470" height="486" rx="5" fill="url(#panel)" stroke="#465751"/>
    <text x="22" y="34" fill="#e8ba79" font-family="monospace" font-size="12" font-weight="bold">01 / REQUEST CARGO PICKUP</text>
    <rect x="16" y="54" width="438" height="230" fill="#213034"/>
    <path d="M16 207q65-40 120-5t112-10q68-48 127-7t79-13v112H16z" fill="#6b5146"/><path d="M16 214q65-15 120 8t112 1q68-15 127 4t79-5" fill="none" stroke="#d19b6b" stroke-width="5"/>
    <path d="M73 205v-47l17-18h69l17 18v47z" fill="#344443" stroke="#b8c0ad" stroke-width="3"/><path d="M91 158h67v9H91z" fill="#9b7657"/><path d="M104 177h43v19h-43z" fill="#e8ba79"/><path d="M65 210h125" stroke="#273631" stroke-width="6"/>
    <g transform="translate(251 207)"><use href="#post"/></g>
    <g transform="translate(215 185)"><use href="#crate"/></g><g transform="translate(245 158)"><use href="#crate"/></g><g transform="translate(278 186)"><use href="#crate"/></g>
    <path d="M215 147v-37m30 10V91m33 56v-37" stroke="#e8ba79" stroke-width="2" stroke-dasharray="4 5"/><path d="M207 108h85" stroke="#e8ba79" stroke-width="3" opacity=".7"/>
    <text x="22" y="316" fill="#d7caa9" font-family="monospace" font-size="10" font-weight="bold">REMOTE DISPATCH · 2 CONNECTED COLONIES</text>
    <text x="22" y="342" fill="#92a69b" font-family="monospace" font-size="9">Manifest: 5 copper · 3 iron · 1 silver</text>
    <text x="22" y="365" fill="#92a69b" font-family="monospace" font-size="9">Local value: $304</text>
    <text x="22" y="388" fill="#e8ba79" font-family="monospace" font-size="9">Network premium: +10% · +$30</text>
    <rect x="22" y="414" width="203" height="43" rx="3" fill="#d9b67f"/><text x="44" y="441" fill="#182326" font-family="monospace" font-size="10" font-weight="bold">DISPATCH CARGO</text>
    <rect x="238" y="414" width="204" height="43" rx="3" fill="#202d2e" stroke="#65766b"/><text x="263" y="441" fill="#d7caa9" font-family="monospace" font-size="10" font-weight="bold">SELL LOCALLY</text>
  </g>
  <!-- system network -->
  <g transform="translate(538 122)">
    <rect width="1016" height="486" rx="5" fill="url(#panel)" stroke="#465751"/>
    <text x="24" y="34" fill="#e8ddc3" font-family="monospace" font-size="12" font-weight="bold">02 / VESPER ROUTE MAP · CONNECTED COLONIES 3/5</text>
    <text x="24" y="58" fill="#92a69b" font-family="monospace" font-size="9">Posts are route nodes. New colony links to nearest connected post; route pulses are visual sale feedback.</text>
    <!-- system routes behind planets -->
    <path d="M185 228Q310 123 425 212T640 270T836 205" fill="none" stroke="#b48656" stroke-width="4" opacity=".22"/>
    <path d="M185 228Q310 123 425 212T640 270" fill="none" stroke="#e8ba79" stroke-width="4" stroke-dasharray="7 10"/>
    <path d="M425 212T640 270T836 205" fill="none" stroke="#81918a" stroke-width="3" stroke-dasharray="4 9" opacity=".6"/>
    <circle cx="185" cy="228" r="67" fill="url(#planet)" stroke="#e8ba79" stroke-width="3"/><circle cx="425" cy="212" r="57" fill="#425866" stroke="#a8d5df" stroke-width="3"/><circle cx="640" cy="270" r="62" fill="#46544e" stroke="#b6c1ae" stroke-width="3"/><circle cx="836" cy="205" r="58" fill="#4b4654" stroke="#c5b8d5" stroke-width="3"/>
    <path d="M125 228q30-20 60 0t60 0M375 215q25-14 50 0t50 0M585 274q28-17 55 0t56 0M782 210q24-18 48 0t48 0" fill="none" stroke="#ba8862" stroke-width="4"/>
    <g transform="translate(185 175) scale(.68)"><use href="#post"/></g><g transform="translate(425 166) scale(.6)"><use href="#post"/></g><g transform="translate(640 219) scale(.65)"><use href="#post"/></g><g transform="translate(836 155) scale(.6)" opacity=".35"><use href="#post"/></g>
    <text x="142" y="323" fill="#e8ba79" font-family="monospace" font-size="9" font-weight="bold">MARS · LINKED</text><text x="380" y="296" fill="#a8d5df" font-family="monospace" font-size="9" font-weight="bold">CRYO · LINKED</text><text x="587" y="354" fill="#b6c1ae" font-family="monospace" font-size="9" font-weight="bold">GRAVEYARD · LINKED</text><text x="790" y="286" fill="#c5b8d5" font-family="monospace" font-size="9">PRISM · NOT LINKED</text>
    <!-- active shipment -->
    <circle cx="314" cy="194" r="15" fill="#e8ba79" opacity=".22" filter="url(#glow)"/><g transform="translate(314 194) scale(.72)"><use href="#crate"/></g><path d="M201 215Q285 153 416 204" fill="none" stroke="#f0c78a" stroke-width="2" stroke-dasharray="4 7"/>
    <rect x="25" y="400" width="966" height="55" rx="3" fill="#172326" stroke="#465751"/><text x="44" y="423" fill="#e8ba79" font-family="monospace" font-size="10" font-weight="bold">SHIPMENT EN ROUTE</text><text x="44" y="441" fill="#92a69b" font-family="monospace" font-size="9">MARS → CRYO · 9 ORE UNITS · +10% NETWORK RATE</text><rect x="869" y="411" width="98" height="31" rx="2" fill="#202d2e" stroke="#65766b"/><text x="890" y="431" fill="#d7caa9" font-family="monospace" font-size="9" font-weight="bold">SKIP ▶</text>
  </g>
  <!-- receipt and progression -->
  <g transform="translate(46 630)">
    <rect width="722" height="324" rx="5" fill="url(#panel)" stroke="#465751"/>
    <text x="22" y="34" fill="#e8ba79" font-family="monospace" font-size="12" font-weight="bold">03 / ITEMIZED RECEIPT · PAID ONCE</text>
    <rect x="18" y="56" width="686" height="242" rx="3" fill="#111b1e" stroke="#465751"/>
    <text x="44" y="91" fill="#8be1cf" font-family="monospace" font-size="11" font-weight="bold">VESPER EXCHANGE SETTLEMENT</text>
    <text x="44" y="130" fill="#92a69b" font-family="monospace" font-size="10">Ore manifest value</text><text x="647" y="130" fill="#d7caa9" font-family="monospace" font-size="10" text-anchor="end">$304</text>
    <text x="44" y="159" fill="#92a69b" font-family="monospace" font-size="10">Network rate (2 connected posts)</text><text x="647" y="159" fill="#e8ba79" font-family="monospace" font-size="10" text-anchor="end">+10%</text>
    <text x="44" y="188" fill="#92a69b" font-family="monospace" font-size="10">Network premium</text><text x="647" y="188" fill="#e8ba79" font-family="monospace" font-size="10" text-anchor="end">+$30</text>
    <path d="M44 207H660" stroke="#465751"/><text x="44" y="245" fill="#e8ddc3" font-family="monospace" font-size="12" font-weight="bold">CREDITS RECEIVED</text><text x="647" y="251" fill="#f0c78a" font-family="monospace" font-size="24" font-weight="bold" text-anchor="end">$334</text>
    <text x="44" y="278" fill="#879a8e" font-family="monospace" font-size="8">Manifest is removed once; dispatch cannot be claimed again after reload.</text>
  </g>
  <g transform="translate(790 630)">
    <rect width="764" height="324" rx="5" fill="url(#panel)" stroke="#465751"/>
    <text x="22" y="34" fill="#e8ddc3" font-family="monospace" font-size="12" font-weight="bold">NETWORK PROGRESSION</text>
    <path d="M90 119H657" stroke="#596b61" stroke-width="4"/><path d="M90 119H373" stroke="#e8ba79" stroke-width="4"/>
    <g font-family="monospace" font-size="9" text-anchor="middle"><circle cx="90" cy="119" r="18" fill="#344443" stroke="#e8ba79" stroke-width="3"/><text x="90" y="123" fill="#e8ba79">1</text><text x="90" y="157" fill="#d7caa9">MARS</text><text x="90" y="174" fill="#8be1cf">POST BUILT</text><circle cx="373" cy="119" r="18" fill="#344443" stroke="#e8ba79" stroke-width="3"/><text x="373" y="123" fill="#e8ba79">2</text><text x="373" y="157" fill="#d7caa9">CRYO</text><text x="373" y="174" fill="#8be1cf">POST BUILT</text><circle cx="657" cy="119" r="18" fill="#202d2e" stroke="#718078" stroke-width="3"/><text x="657" y="123" fill="#879a8e">3</text><text x="657" y="157" fill="#92a69b">NEXT WORLD</text><text x="657" y="174" fill="#879a8e">UNLOCKED LATER</text></g>
    <rect x="22" y="211" width="720" height="80" rx="3" fill="#111b1e" stroke="#465751"/>
    <text x="42" y="240" fill="#e8ba79" font-family="monospace" font-size="10" font-weight="bold">NETWORK BONUS</text><text x="42" y="263" fill="#92a69b" font-family="monospace" font-size="9">10% per remote linked post · maximum 40% · applied once to a local post sale.</text>
    <text x="42" y="281" fill="#879a8e" font-family="monospace" font-size="8">More planets give route choices and campaign progress, not a runaway price multiplier.</text>
  </g>
  <text x="48" y="991" fill="#879a8e" font-family="monospace" font-size="9">OFFLINE-SAFE DESIGN · ROUTE PULSE IS PRESENTATION · CARGO MANIFEST + CREDIT SETTLEMENT ARE SAVED LOCALLY AND RESOLVE EXACTLY ONCE</text>
</svg>
