<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Surface colony building roster and tile footprints</title>
  <desc id="desc">A coding reference showing first-playable colony buildings, their top-down tile masks, silhouettes, and proposed credit plus ore costs.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172326"/><stop offset="1" stop-color="#10191c"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#52625a" stroke-width="1"/></pattern>
    <g id="building"><path d="M-28 0v-23l9-10h38l9 10V0z" fill="#344443" stroke="#c1c6ae" stroke-width="2"/><path d="M-22-28h44v5h-44z" fill="#758178"/><path d="M-18-17h13v11h-13zm23 0h13v11H5z" fill="#e8ba79"/><path d="M-32 2h64" stroke="#273631" stroke-width="4"/></g>
    <g id="cell"><rect width="20" height="20" rx="2" fill="#65736a" stroke="#9aa697" stroke-width="1.5"/></g>
    <g id="one"><use href="#cell"/></g>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="46" y="49" fill="#e8ddc3" font-family="monospace" font-size="25" font-weight="bold" letter-spacing="3">SURFACE COLONY · BUILDING ROSTER</text>
  <text x="47" y="78" fill="#92a69b" font-family="monospace" font-size="11" letter-spacing="2">FIRST-PLAYABLE KIT · TILE FOOTPRINTS · PROPOSED CASH + ORE COSTS</text>
  <path d="M46 99H1554" stroke="#465751"/>
  <text x="61" y="132" fill="#d7caa9" font-family="monospace" font-size="10" letter-spacing="1">TOP-DOWN MASK · TANGENT RUNS LEFT TO RIGHT</text><text x="990" y="132" fill="#d7caa9" font-family="monospace" font-size="10" letter-spacing="1">COSTS ARE BALANCE PROPOSALS, NOT IMPLEMENTED VALUES</text>

  <!-- Row 1 cards -->
  <g transform="translate(48 153)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#8be1cf" font-family="monospace" font-size="12" font-weight="bold">ORE EXCHANGE · CORE SERVICE</text><g transform="translate(77 97) scale(.7)"><use href="#building"/><path d="M-13-29v-28h26v28M-13-50h26l7 13h-40z" fill="#758178" stroke="#c1c6ae" stroke-width="2"/><path d="M-43-7h15v20h-15zm71 0h15v20H28z" fill="#7a5a43" stroke="#d39b69" stroke-width="2"/></g><rect x="143" y="49" width="84" height="64" fill="url(#grid)"/><g transform="translate(145 51)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" x="40"/><use href="#cell" x="60"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/><use href="#cell" x="40" y="20"/><use href="#cell" x="60" y="20"/><use href="#cell" y="40"/><use href="#cell" x="20" y="40"/><use href="#cell" x="40" y="40"/><use href="#cell" x="60" y="40"/></g><text x="247" y="60" fill="#92a69b" font-family="monospace" font-size="9">4 × 3 TILES</text><text x="247" y="83" fill="#d7caa9" font-family="monospace" font-size="9">Sell ore / request pickup</text><text x="247" y="111" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$320 + 4 Cu + 2 Fe</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Wide hopper · chute · side bins</text></g>
  <g transform="translate(556 153)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#8be1cf" font-family="monospace" font-size="12" font-weight="bold">REPAIR BAY · CORE SERVICE</text><g transform="translate(77 97) scale(.7)"><use href="#building"/><path d="M-18 0v-25h36V0" fill="#172326" stroke="#c1c6ae" stroke-width="3"/><path d="M-24-29h48v5h-48z" fill="#d0b982"/></g><g transform="translate(145 51)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" x="40"/><use href="#cell" x="60"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/><use href="#cell" x="40" y="20"/><use href="#cell" x="60" y="20"/><use href="#cell" y="40"/><use href="#cell" x="20" y="40"/><use href="#cell" x="40" y="40"/><use href="#cell" x="60" y="40"/></g><text x="247" y="60" fill="#92a69b" font-family="monospace" font-size="9">4 × 3 TILES</text><text x="247" y="83" fill="#d7caa9" font-family="monospace" font-size="9">Hull / structure repair</text><text x="247" y="111" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$240 + 3 Cu + 2 Fe</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Broad bay door · side towers · roof lintel</text></g>
  <g transform="translate(1064 153)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#c5b8d5" font-family="monospace" font-size="12" font-weight="bold">POD WORKSHOP · CORE SERVICE</text><g transform="translate(77 97) scale(.7)"><use href="#building"/><path d="M-17-33v-22h34v22m-17-22v-9m-12 9h24" fill="none" stroke="#c5b8d5" stroke-width="4"/><path d="M0-53v13l7 7" stroke="#c5b8d5" stroke-width="3"/></g><g transform="translate(145 51)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" x="40"/><use href="#cell" x="60"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/><use href="#cell" x="40" y="20"/><use href="#cell" x="60" y="20"/><use href="#cell" y="40"/><use href="#cell" x="20" y="40"/><use href="#cell" x="40" y="40"/><use href="#cell" x="60" y="40"/></g><text x="247" y="60" fill="#92a69b" font-family="monospace" font-size="9">4 × 3 TILES</text><text x="247" y="83" fill="#d7caa9" font-family="monospace" font-size="9">Pod / drill upgrades</text><text x="247" y="111" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$420 + 3 Cu + 3 Fe + 1 Ag</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Tool drawers · raised gantry · hanging bit</text></g>

  <!-- Row 2 cards -->
  <g transform="translate(48 370)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#8be1cf" font-family="monospace" font-size="12" font-weight="bold">HABITAT · LOCAL SHELTER</text><g transform="translate(77 97) scale(.7)"><use href="#building"/><path d="M-14-30v-13q14-18 28 0v13" fill="#53615a" stroke="#c1c6ae" stroke-width="2"/><path d="M-10-38h20v12h-20z" fill="#e8ba79"/><path d="M-10 1l-8 9m28-9 8 9" stroke="#83958a" stroke-width="4"/></g><g transform="translate(155 61)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" x="40"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/><use href="#cell" x="40" y="20"/><use href="#cell" y="40"/><use href="#cell" x="20" y="40"/><use href="#cell" x="40" y="40"/></g><text x="247" y="70" fill="#92a69b" font-family="monospace" font-size="9">3 × 3 TILES</text><text x="247" y="93" fill="#d7caa9" font-family="monospace" font-size="9">Shelter / nearby services</text><text x="247" y="121" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$900 + 4 Cu + 2 Fe + 1 Ag</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Airlock · warm windows · raised foundation feet</text></g>
  <g transform="translate(556 370)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#8be1cf" font-family="monospace" font-size="12" font-weight="bold">CHARGE DEPOT · LOCAL REFILL</text><g transform="translate(77 97)"><rect x="-26" y="-29" width="21" height="38" rx="7" fill="#465650" stroke="#c1c6ae" stroke-width="2"/><rect x="5" y="-29" width="21" height="38" rx="7" fill="#465650" stroke="#c1c6ae" stroke-width="2"/><path d="M-21-31v-7h11v7m20 0v-7h11v7" fill="#758178"/><path d="M-18-16h8m22 0h8" stroke="#8be1cf" stroke-width="4"/></g><g transform="translate(165 71)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/><use href="#cell" y="40"/><use href="#cell" x="20" y="40"/></g><text x="247" y="80" fill="#92a69b" font-family="monospace" font-size="9">2 × 3 TILES</text><text x="247" y="103" fill="#d7caa9" font-family="monospace" font-size="9">Refills existing Charge</text><text x="247" y="131" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$180 + 3 Cu + 1 Fe</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Two tanks · valve block · mint charge bars</text></g>
  <g transform="translate(1064 370)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#c5b8d5" font-family="monospace" font-size="12" font-weight="bold">BEACON · SURVEY LANDMARK</text><g transform="translate(77 98)"><path d="M-24 3h48v10h-48z" fill="#344443" stroke="#c1c6ae" stroke-width="2"/><path d="M0 3v-50m-8 10h16m-8-10 12-7" stroke="#c5b8d5" stroke-width="4"/><path d="M0-51l12-10 12 10-12 10z" fill="#8be1cf" stroke="#d7caa9" stroke-width="2"/></g><g transform="translate(165 81)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/></g><text x="247" y="90" fill="#92a69b" font-family="monospace" font-size="9">2 × 2 TILES</text><text x="247" y="113" fill="#d7caa9" font-family="monospace" font-size="9">Map marker / navigation</text><text x="247" y="141" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$140 + 2 Cu + 1 Fe</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Distinct lamp, not ore-like; optional low-cost utility</text></g>

  <!-- Row 3 cards -->
  <g transform="translate(48 587)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#e8ba79" font-family="monospace" font-size="12" font-weight="bold">STARTER TURRET · LOCAL DEFENSE</text><g transform="translate(77 99)"><path d="M-24 4h48v9h-48z" fill="#344443" stroke="#c1c6ae" stroke-width="2"/><path d="M-15 2v-22l8-9h14l8 9V2z" fill="#465650" stroke="#d5b67e" stroke-width="2"/><path d="M0-28v-22m0 8 16-8" stroke="#e8ba79" stroke-width="4"/><circle cx="17" cy="-50" r="4" fill="#f0b866"/></g><g transform="translate(165 81)"><use href="#cell"/><use href="#cell" x="20"/><use href="#cell" y="20"/><use href="#cell" x="20" y="20"/></g><text x="247" y="90" fill="#92a69b" font-family="monospace" font-size="9">2 × 2 TILES</text><text x="247" y="113" fill="#d7caa9" font-family="monospace" font-size="9">One hit · 5 surface tiles</text><text x="247" y="141" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">$180 + 2 Fe</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Upgrade optics/range, then rotary fire cadence</text></g>
  <g transform="translate(556 587)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#c4a77d" font-family="monospace" font-size="12" font-weight="bold">WALL + GATE · PERIMETER</text><g transform="translate(77 99)"><path d="M-34 6v-23h15V6zm-1-27v-22h17v22zm38 27v-23h15V6zm-1-27v-22h17v22z" fill="#465650" stroke="#c1c6ae" stroke-width="2"/><path d="M-18-4v-21h36v21" fill="none" stroke="#8be1cf" stroke-width="3"/><path d="M-15-25 0-42 15-25" fill="none" stroke="#8be1cf" stroke-width="3"/></g><g transform="translate(165 81)"><use href="#cell"/></g><text x="247" y="90" fill="#92a69b" font-family="monospace" font-size="9">WALL 1×1 / GATE 2-TILE GAP</text><text x="247" y="113" fill="#d7caa9" font-family="monospace" font-size="9">Wall $35 + 1 Cu per tile</text><text x="247" y="141" fill="#e8ba79" font-family="monospace" font-size="11" font-weight="bold">Gate: $120 + 2 Cu + 1 Fe</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Stackable blocks · automatic raised pass-through</text></g>
  <g transform="translate(1064 587)"><rect width="488" height="201" rx="4" fill="#202d2e" stroke="#465751"/><text x="18" y="27" fill="#8be1cf" font-family="monospace" font-size="12" font-weight="bold">TURRET OPTICS → ROTARY DRIVE</text><g transform="translate(77 101)"><path d="M-20 2h40v8h-40z" fill="#344443" stroke="#c1c6ae" stroke-width="2"/><path d="M-13 1v-23l7-8h12l7 8V1z" fill="#465650" stroke="#d5b67e" stroke-width="2"/><path d="M0-30v-22m0 8 18-8m-18 8-17-8" stroke="#c5b8d5" stroke-width="3"/><circle cx="0" cy="-52" r="14" fill="none" stroke="#c5b8d5" stroke-width="2" stroke-dasharray="2 3"/></g><text x="137" y="76" fill="#92a69b" font-family="monospace" font-size="8">EXISTING TURRET · NO NEW FOOTPRINT</text><text x="137" y="103" fill="#d7caa9" font-family="monospace" font-size="9">Optics: $260 + 2 Fe + 1 Ag</text><text x="137" y="126" fill="#d7caa9" font-family="monospace" font-size="9">Rotary: $420 + 3 Fe + 2 Ag</text><text x="18" y="178" fill="#879a8e" font-family="monospace" font-size="9">Sensor gains range first; rotary increases shots/min</text></g>

  <rect x="48" y="816" width="1504" height="254" rx="4" fill="#172326" stroke="#465751"/>
  <text x="70" y="851" fill="#e8ddc3" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">LATER ONLY · ADD AFTER CORE BUILD / DEFEND LOOP IS FUN</text>
  <g font-family="monospace" font-size="11" fill="#b9c3b4">
    <text x="80" y="891">ORE SILO</text><text x="80" y="914" fill="#879a8e" font-size="9">Only if cargo storage becomes a real need.</text>
    <text x="410" y="891">POWER RELAY</text><text x="410" y="914" fill="#879a8e" font-size="9">Initially visual/cosmetic; avoid power-grid chores.</text>
    <text x="790" y="891">DEFENSE WORKSHOP</text><text x="790" y="914" fill="#879a8e" font-size="9">Only if turret upgrades need a distinct unlock hub.</text>
    <text x="1190" y="891">GARAGE / COMMS / FARM</text><text x="1190" y="914" fill="#879a8e" font-size="9">New systems need separate design and playtest.</text>
  </g>
  <path d="M70 941H1528" stroke="#465751"/>
  <text x="70" y="973" fill="#8be1cf" font-family="monospace" font-size="10" font-weight="bold">BALANCE RULES</text>
  <text x="70" y="999" fill="#92a69b" font-family="monospace" font-size="10">1 · Keep essential services available at the crashed ship.   2 · Starter defenses use common iron, not mandatory rare gold.   3 · Credits + ore costs are both shown before confirmation.</text>
  <text x="70" y="1025" fill="#92a69b" font-family="monospace" font-size="10">4 · Compact modules may touch footprint edges; reject actual overlap only.   5 · Costs above are proposal values and require expedition-economy playtesting.</text>
  <text x="48" y="1100" fill="#879a8e" font-family="monospace" font-size="9">CU = COPPER · FE = IRON · AG = SILVER · FOOTPRINT SHOWS GROUND BLOCKS ONLY; ROOFS / MASTS / GUNS ARE NON-BLOCKING SILHOUETTE</text>
</svg>
